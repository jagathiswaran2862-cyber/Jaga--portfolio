<<!DOCTYPE html>
<html lang="en">
<head>

    <title>Jagathiswaran - Professional Photographer & Designer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #030303;
            color: #ffffff;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }
        /* Loader screen */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            font-size: 5rem;
            font-weight: 800;
            color: #d4af37;
            letter-spacing: -2px;
        }
        
        /* Single Line Letter-by-letter Name Animation */
        .name-container {
            display: inline-flex;
            white-space: nowrap;
            justify-content: center;
            gap: 2px;
        }
        .name-letter {
            opacity: 0;
            transform: translateY(40px);
            animation: letterAppear 0.8s forwards;
        }
        @keyframes letterAppear {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Gold and Black Sony Camera Lens Background (Mild & Elegant) */
        .sony-camera-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 650px;
            height: 650px;
            pointer-events: none;
            z-index: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0.22; /* Mild background visibility */
        }
